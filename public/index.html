<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tuchini del Borghetto - Menu Rapido</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 20px 16px; 
            background: #f4f7fc; 
            color: #1f2937; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white; 
            padding: 35px 24px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); 
            max-width: 420px; 
            width: 100%; 
            margin: auto; 
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .logo-aziendale { max-width: 140px; height: auto; margin-bottom: 12px; }
        h2 { font-size: 22px; color: #111827; font-weight: 700; margin-top: 0; margin-bottom: 6px; }
        .sottotitolo { font-size: 14px; color: #6b7280; margin-bottom: 28px; line-height: 1.4; }

        /* Contenitore dei pulsanti */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Stile sobrio: grigio chiaro con contorno scuro */
        .btn-menu {
            width: 100%;
            background: #f8fafc; 
            color: #1f2937; 
            border: 1.5px solid #cbd5e1; 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer; 
            min-height: 50px; 
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02); 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-menu:hover {
            background: #f1f5f9;
            border-color: #475569;
            color: #0f172a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .btn-menu:active { 
            transform: scale(0.98); 
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logotuchini.png" alt="Logo" class="logo-aziendale">
        
        <h2>Menu Rapido</h2>
        <p class="sottotitolo"></p>

        <div class="menu-container">
            <!-- Pulsante 1 -->
            <a href="https://iscrizionituchini.web.app/adulti_anagrafica.html" class="btn-menu btn-1" target="_blank">DB Adulti</a>
            
            <!-- Pulsante 2 -->
            <a href="https://iscrizionituchini.web.app/bambini_anagrafica.html" class="btn-menu btn-2" target="_blank">DB Anni Verdi&Rossi</a>
            
            <!-- Pulsante 3 -->
            <a href="https://iscrizionituchini.web.app/schermo_anagrafica.html" class="btn-menu btn-3" target="_blank">Monitor numeri</a>
            
            <!-- Pulsante 4 -->
            <a href="https://iscrizionituchini.web.app/banco.html" class="btn-menu btn-4" target="_blank">Chiamata numeri</a>            
        </div>
    </div>

    <script>
        document.getElementById('btnAccessoSpeciale').addEventListener('click', function(e) {
            e.preventDefault(); // Blocca l'apertura immediata del link
            const password = prompt("Inserisci la password per l'Accesso Speciale:");
            
            if (password === "1978") {
                window.open(this.href, '_blank'); // Se corretta, apre la pagina in una nuova scheda
            } else if (password !== null) {
                alert("Password errata!"); // Se errata (e non premuto Annulla), avvisa l'utente
            }
        });
    </script>

</body>
</html>
